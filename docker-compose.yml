# Based on github.com/Davlatyarov/personal-secure-gateway
services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    ports:
      # Web Admin UI: host 3080 -> container 8080
      - "3080:8080/tcp"
      # DNS-over-TLS (DoT Port 853) for Android Private DNS & encrypted clients
      - "853:853/tcp"
      - "853:853/udp"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    environment:
      - TZ=Asia/Tashkent
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
