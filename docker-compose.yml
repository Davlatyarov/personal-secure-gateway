# Based on github.com/Davlatyarov/personal-secure-gateway
# Integrated Personal Secure Gateway (AdGuard Home + WireGuard VPN)
networks:
  gateway:
    name: gateway
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${GATEWAY_SUBNET:-172.28.0.0/24}

services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    networks:
      gateway:
        ipv4_address: ${ADGUARD_IP:-172.28.0.10}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    ports:
      # Web Admin UI: host 3080 -> container 8080
      - "3080:8080/tcp"
      # DNS-over-TLS (DoT Port 853) for Android Private DNS & encrypted clients
      - "853:853/tcp"
      - "853:853/udp"
      # Note: Plain port 53 is deliberately NOT exposed to host.
      # WireGuard clients query AdGuard internally via 172.28.0.10:53 inside the gateway network.
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    environment:
      - TZ=${TZ:-Asia/Tashkent}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: unless-stopped
    networks:
      gateway:
        ipv4_address: ${WG_IP:-172.28.0.20}
    ports:
      # WireGuard data plane (UDP tunnel)
      - "${WG_PORT:-51820}:51820/udp"
      # Web UI: bound to loopback only for security (SSH tunnel: ssh -L 51821:127.0.0.1:51821 root@server)
      - "127.0.0.1:${WG_UI_PORT:-51821}:51821/tcp"
    volumes:
      - ./wg:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    environment:
      - PORT=51821
      - HOST=0.0.0.0
      - INSECURE=true
      - DISABLE_IPV6=${DISABLE_IPV6:-true}
      - INIT_ENABLED=${INIT_ENABLED:-false}
      - INIT_USERNAME=${INIT_USERNAME:-}
      - INIT_PASSWORD=${INIT_PASSWORD:-}
      - INIT_HOST=${INIT_HOST:-}
      - INIT_PORT=${WG_PORT:-51820}
      - INIT_DNS=${ADGUARD_IP:-172.28.0.10}
      - INIT_IPV4_CIDR=${WG_SUBNET:-10.8.0.0/24}
      - INIT_ALLOWED_IPS=${WG_ALLOWED_IPS:-0.0.0.0/0}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
