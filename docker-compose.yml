# Based on github.com/Davlatyarov/personal-secure-gateway @ ff3661b
# Changes for this server (HestiaCP):
#  - admin UI on host port 3080: 8080 is taken by Apache (Hestia backend)
#  - Docker log rotation so container logs can't fill the disk
#  - DNS access list is in conf/AdGuardHome.yaml (dns.allowed_clients)
services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M
    ports:
      # Web Admin UI: host 3080 -> container 8080
      - "3080:8080/tcp"
      # DNS
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    environment:
      - TZ=Asia/Tashkent
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
